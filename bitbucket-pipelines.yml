# CI for claude-kit. No dependencies to install: every check is plain node.
image: node:22

definitions:
  steps:
    - step: &check
        name: validate + test
        script:
          - node --version
          - node scripts/validate.mjs
          # Quoted so node expands the glob, not the shell.
          - node --test "plugins/**/tests/*.test.mjs"

pipelines:
  default:
    - step: *check
  pull-requests:
    "**":
      - step: *check
