name: validate

on:
  push:
  pull_request:

jobs:
  check:
    # Windows is in the matrix on purpose: the whole point of the node-only rule
    # is that hooks behave identically there, and a Linux-only CI would not catch
    # a regression that reintroduces a POSIX assumption.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump gate diffs against a base ref, which a depth-1
          # clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository structure
        run: node scripts/validate.mjs
      - name: Run tests
        # Quoted so node expands the glob, not the shell. Keeps new test files
        # picked up automatically instead of needing a CI edit.
        run: node --test "plugins/**/tests/*.test.mjs" "tests/*.test.mjs"
      - name: Check plugin version bumps
        if: matrix.os == 'ubuntu-latest'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-version-bump.mjs --base "$BASE"
